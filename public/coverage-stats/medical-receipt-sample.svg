<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="70" y="52" width="1060" height="656" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="110" y="120" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">진료비 영수증 예시</text>
  <text x="110" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#64748b">개인정보 제거 상담용 샘플 · 실제 금액은 병원별로 다릅니다</text>
  <rect x="110" y="198" width="980" height="64" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="135" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">구분</text>
  <text x="510" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">설명</text>
  <text x="900" y="238" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#1d4ed8">상담 포인트</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="110" y="282" width="980" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="135" y="327" fill="#0f172a">급여 본인부담</text>
    <text x="410" y="327" fill="#475569">건강보험 적용 후 고객 부담</text>
    <text x="875" y="327" fill="#1d4ed8">산정특례 영향</text>
    <rect x="110" y="376" width="980" height="74" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="135" y="421" fill="#9a3412">비급여</text>
    <text x="410" y="421" fill="#475569">선택 치료, 상급병실, 일부 검사</text>
    <text x="875" y="421" fill="#c2410c">실손 한도 확인</text>
    <rect x="110" y="470" width="980" height="74" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="135" y="515" fill="#991b1b">전액본인부담</text>
    <text x="410" y="515" fill="#475569">급여 기준 밖 사용 시 발생</text>
    <text x="875" y="515" fill="#dc2626">별도 준비 필요</text>
    <rect x="110" y="564" width="980" height="74" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="135" y="609" fill="#047857">공단부담금</text>
    <text x="410" y="609" fill="#475569">국민건강보험에서 지원</text>
    <text x="875" y="609" fill="#059669">나라 지원 영역</text>
  </g>
  <text x="110" y="674" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#64748b">상담 결론: 나라 지원과 실손으로 줄어드는 부분, 그래도 남는 비급여·전액본인부담·생활비를 분리해서 준비합니다.</text>
</svg>
