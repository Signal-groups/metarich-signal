<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>변액보험 모집인 검정시험
모의고사 7~8회</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
:root{--navy:#0d1b2a;--navy2:#162537;--accent:#9333ea;--accent2:#7e22ce;--text:#dde4f0;--muted:#7a90b0;--surface:#182840;--surface2:#1f3352;--border:rgba(255,255,255,0.07);--green:#22c55e;--red:#ef4444;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--navy);color:var(--text);font-size:14px;line-height:1.7;}
.header{background:linear-gradient(135deg,#091525 0%,#1a0f2e 50%,#2d1a52 100%);border-bottom:2px solid var(--accent);padding:36px 40px 28px;position:relative;overflow:hidden;}
.header::after{content:'';position:absolute;bottom:-80px;right:-80px;width:260px;height:260px;background:radial-gradient(circle,rgba(147,51,234,0.1) 0%,transparent 70%);pointer-events:none;}
.header-badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:2px;margin-bottom:12px;}
.header h1{font-size:26px;font-weight:900;color:#fff;margin-bottom:8px;}
.header-meta{color:var(--muted);font-size:12px;display:flex;gap:24px;flex-wrap:wrap;margin-top:16px;}
.header-meta span{display:flex;align-items:center;gap:6px;}
.header-meta strong{color:var(--accent);}
.exam-selector{display:flex;background:var(--navy2);border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:0;z-index:200;}
.exam-tab{padding:14px 28px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;user-select:none;}
.exam-tab:hover{color:var(--text);background:rgba(255,255,255,0.03);}
.exam-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.container{max-width:860px;margin:0 auto;padding:32px 20px 80px;}
.exam-section{display:none;}.exam-section.active{display:block;}
.info-bar{display:flex;gap:16px;margin-bottom:28px;flex-wrap:wrap;}
.info-chip{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:12px;color:var(--muted);}
.info-chip strong{color:var(--accent);}
.subject-divider{background:linear-gradient(90deg,rgba(0,0,0,0.3),rgba(0,0,0,0.1));border-left:3px solid var(--accent);padding:12px 20px;border-radius:0 8px 8px 0;margin:28px 0 16px;display:flex;align-items:center;gap:12px;}
.subject-divider .sub-num{background:var(--accent);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;letter-spacing:1px;}
.subject-divider .sub-title{font-size:14px;font-weight:700;color:#fff;}
.subject-divider .sub-count{margin-left:auto;font-size:11px;color:var(--muted);}
.q-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:12px;transition:border-color .2s;}
.q-header{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;}
.q-num{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
.q-text{font-size:13.5px;color:var(--text);line-height:1.7;flex:1;}
.q-choices{display:flex;flex-direction:column;gap:6px;padding-left:4px;}
.choice-label{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--surface2);}
.choice-label input{display:none;}
.choice-label.selected{border-color:var(--accent);background:rgba(255,255,255,0.04);}
.choice-label.correct{border-color:var(--green)!important;background:rgba(34,197,94,0.1)!important;color:var(--green)!important;}
.choice-label.wrong{border-color:var(--red)!important;background:rgba(239,68,68,0.1)!important;color:var(--red)!important;}
.choice-idx{font-size:12px;font-weight:700;color:var(--muted);width:14px;flex-shrink:0;margin-top:1px;}
.choice-text{font-size:13px;line-height:1.6;}
.q-explain{display:none;margin-top:10px;padding:10px 14px;background:rgba(255,255,255,0.03);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:12px;color:var(--muted);line-height:1.8;}
.q-explain strong{color:var(--accent);}
.q-explain.show{display:block;}
.action-bar{position:sticky;bottom:0;background:var(--navy2);border-top:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:100;}
.btn{padding:10px 24px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:all .15s;font-family:inherit;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-note{background:rgba(201,169,110,0.15);color:#c9a96e;border:1px solid rgba(201,169,110,0.3);padding:10px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;}
.btn-note:hover{background:rgba(201,169,110,0.25);}
.timer-display{font-size:13px;font-weight:700;color:var(--text);padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px;letter-spacing:1px;}
.timer-display.warn{color:var(--red);border-color:rgba(239,68,68,0.4);}
.progress-wrap{height:3px;background:var(--surface2);border-radius:2px;margin-bottom:20px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s;}
.result-card{display:none;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-top:24px;text-align:center;}
.result-card.show{display:block;}
.result-icon{font-size:48px;margin-bottom:12px;}
.result-title{font-size:22px;font-weight:900;margin-bottom:8px;}
.result-pass{color:var(--green);}
.result-fail{color:var(--red);}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0;}
.result-item{background:var(--surface2);border-radius:8px;padding:14px;}
.result-item-val{font-size:22px;font-weight:900;color:var(--accent);margin-bottom:4px;}
.result-item-label{font-size:11px;color:var(--muted);}
.odalNote-save{background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);border-radius:8px;padding:12px 16px;margin-top:16px;font-size:12px;color:#c9a96e;display:none;}
.odalNote-save.show{display:block;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--navy);}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px;}
@media(max-width:640px){.header{padding:24px 16px 20px;}.header h1{font-size:20px;}.container{padding:20px 12px 80px;}.exam-tab{padding:12px 18px;font-size:12px;}.result-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>

<script>
const DATA = {"exam1_s1": [{"n": 1, "q": "변액종신보험에서 '최저사망보험금 보증(GMDB)'이란?", "c": ["펀드 수익률이 낮아도 일정 금액의 사망보험금을 보증하는 것", "사망 원인에 관계없이 보험금을 지급하는 것", "보험료를 평생 납입하는 것", "특별계정 운용 수익을 보증하는 것"], "a": 0, "ex": "GMDB(Guaranteed Minimum Death Benefit)는 펀드 운용 실적에 관계없이 사망 시 최소한의 사망보험금을 보증하는 제도입니다.", "cat": "최저보증"}, {"n": 2, "q": "변액연금보험에서 적립기간에 대한 설명으로 옳은 것은?", "c": ["보험금을 연금으로 받는 기간", "보험료를 납입하고 투자하는 기간", "보험계약이 유지되는 전체 기간", "보험회사가 운용하는 기간"], "a": 1, "ex": "변액연금보험에서 적립기간이란 보험료를 납입하고 특별계정에서 투자·운용하는 기간입니다.", "cat": "변액보험 개념"}, {"n": 3, "q": "변액보험에서 '펀드 변경'이란?", "c": ["보험회사를 변경하는 것", "보험 종목을 변경하는 것", "특별계정 내 운용 펀드를 다른 펀드로 바꾸는 것", "보험료 납입 금액을 변경하는 것"], "a": 2, "ex": "변액보험에서 펀드 변경이란 보험계약자가 특별계정 내에서 투자하는 펀드를 다른 종류의 펀드로 전환하는 것입니다.", "cat": "변액보험 개념"}, {"n": 4, "q": "변액보험의 사업비 중 '운용보수'에 해당하는 것은?", "c": ["보험계약 체결 시 지급하는 비용", "펀드 운용에 대해 지급하는 보수", "청약 서비스 비용", "보험료 수납 비용"], "a": 1, "ex": "운용보수는 특별계정에서 자산을 운용하는 자산운용사에 지급하는 보수로, 보통 연간 일정 비율로 부과됩니다.", "cat": "운용보수·비용"}, {"n": 5, "q": "변액유니버설보험의 주요 특징으로 옳지 않은 것은?", "c": ["보험료 납입의 유연성", "중도인출 가능", "보험가입금액 조정 가능", "원금 보장"], "a": 3, "ex": "변액유니버설보험은 보험료 납입 유연성, 중도인출, 보험가입금액 조정 등이 가능하지만 원금이 보장되지 않습니다.", "cat": "변액유니버설보험"}, {"n": 6, "q": "변액보험의 투자위험에 대한 설명으로 옳은 것은?", "c": ["보험회사가 모든 투자위험을 부담한다", "보험계약자가 투자위험을 부담한다", "정부가 투자위험을 보장한다", "투자위험은 존재하지 않는다"], "a": 1, "ex": "변액보험에서 특별계정의 운용 실적에 따른 투자위험은 보험계약자가 부담합니다.", "cat": "투자위험"}, {"n": 7, "q": "다음 중 변액보험의 종류에 해당하지 않는 것은?", "c": ["변액종신보험", "변액연금보험", "변액유니버설보험", "변액화재보험"], "a": 3, "ex": "변액보험의 종류에는 변액종신보험, 변액연금보험, 변액유니버설보험 등이 있습니다. 화재보험은 손해보험으로 변액보험 상품이 없습니다.", "cat": "변액보험 종류"}, {"n": 8, "q": "변액보험의 특별계정 운용 실적이 양호할 경우 어떤 현상이 나타나는가?", "c": ["보험료가 낮아진다", "해지환급금과 보험금이 증가한다", "보험기간이 단축된다", "사업비가 환급된다"], "a": 1, "ex": "변액보험에서 특별계정 운용 실적이 좋으면 계약자 적립금이 증가하고, 이에 따라 해지환급금과 사망보험금 등이 증가합니다.", "cat": "특별계정"}, {"n": 9, "q": "변액보험 모집인이 반드시 이수해야 하는 교육으로 옳은 것은?", "c": ["일반 생명보험 교육만으로 충분하다", "변액보험 판매 자격 교육을 별도로 이수해야 한다", "어떠한 교육도 필요 없다", "손해보험 교육을 이수해야 한다"], "a": 1, "ex": "변액보험을 판매하려면 일반 생명보험 모집인 자격과 별도로 변액보험 판매관리사 자격 교 5, "q": "변액연금의 '최저연금적립금 보증(GMAB)'에 대한 설명으로 옳은 것은?", "c": ["연금 지급액의 최소한을 보증하는 것", "연금 지급 개시 시 적립금의 최저 금액을 보증하는 것", "사망 시 연금액을 보증하는 것", "펀드 수익률을 보증하는 것"], "a": 1, "ex": "GMAB(Guaranteed Minimum Accumulation Benefit)는 연금 지급 개시 시점에 계약자 적립금이 일정 금액 이상이 되도록 최저 금액을 보증하는 제도입니다.", "cat": "최저보증"}, {"n": 6, "q": "변액보험 계약 체결 시 교부해야 하는 서류로 옳지 않은 것은?", "c": ["보험약관", "청약서 부본", "보험증권", "투자설명서"], "a": 2, "ex": "변액보험 계약 체결 시에는 보험약관, 청약서 부본, 투자설명서 등을 교부해야 합니다. 보험증권은 계약 체결 후 별도로 교부됩니다.", "cat": "계약 서류"}, {"n": 7, "q": "변액보험의 펀드 종류 중 '주식형 펀드'의 특징으로 옳은 것은?", "c": ["안정적이고 수익률이 낮다", "주식에 주로 투자하여 높은 수익과 높은 위험을 동반한다", "채권에만 투자한다", "원금이 보장된다"], "a": 1, "ex": "주식형 펀드는 자산의 60% 이상을 주식에 투자하는 펀드로, 높은 수익을 기대할 수 있지만 위험도 높습니다.", "cat": "펀드·투자"}, {"n": 8, "q": "변액보험에서 '특별계정 설정'이 필요한 이유로 옳은 것은?", "c": ["세금 혜택을 위해", "계약자의 투자 위험을 보험회사의 일반자산과 분리하기 위해", "보험료를 낮추기 위해", "고객 서비스를 향상시키기 위해"], "a": 1, "ex": "특별계정은 변액보험 계약자의 보험료를 보험회사의 일반자산(일반계정)과 분리하여 운용함으로써, 계약자의 투자 위험을 일반계정으로부터 보호하기 위해 설정됩니다.", "cat": "특별계정"}, {"n": 9, "q": "변액연금보험에서 '연금 지급 개시 연령'에 대한 설명으로 옳은 것은?", "c": ["무조건 만 65세부터 시작한다", "계약 시 정한 연금 개시 연령에 도달하면 시작한다", "임의로 언제든지 시작할 수 있다", "보험회사가 결정한다"], "a": 1, "ex": "변액연금보험의 연금 지급은 계약 시 정한 연금 개시 연령에 도달하면 시작됩니다.", "cat": "변액연금"}, {"n": 10, "q": "변액보험의 보험료 중 '위험보험료'란?", "c": ["펀드 운용에 투자되는 보험료", "순수 사망 보장에 사용되는 보험료", "사업비로 사용되는 보험료", "연금 지급에 사용되는 보험료"], "a": 1, "ex": "위험보험료는 납입 보험료 중 사망이나 재해 등 보험위험 보장에 사용되는 부분입니다.", "cat": "보험료 구성"}, {"n": 11, "q": "변액보험 계약 시 계약자가 확인해야 하는 사항으로 옳지 않은 것은?", "c": ["펀드 운용 실적", "운용 보수 및 수수료", "보험회사 주가", "최저보증 조건"], "a": 2, "ex": "변액보험 계약 시 펀드 운용 실적, 운용 보수·수수료, 최저보증 조건 등을 확인해야 합니다. 보험회사의 주가는 계약 조건이 아닙니다.", "cat": "계약자 정보"}, {"n": 12, "q": "변액보험의 가장 큰 특징으로 옳은 것은?", "c": ["보험료가 고정되어 있다", "보험금이 운용 실적에 따라 변동된다", "원금이 보장된다", "투자와 무관하게 지급된다"], "a": 1, "ex": "변액보험은 보험료의 일부를 특별계정으로 운용하며, 그 운용 실적에 따라 보험금·해지환급금이 변동되는 것이 가장 큰 특징입니다.", "cat": "변액보험 개념"}, {"n": 13, "q": "변액보험의 특별계정에 대한 설명으로 옳지 않은 것은?", "c": ["일반계정과 분리 운용된다", "다양한 펀드에 투자할 수 있다", "손실이 발생해도 보험회사가 책임진다", "투자 위험은 보험계약자가 부담한다"], "a":     html+=`<div class="q-block">
<div class="q-header"><span class="q-num">${qn}번</span><span class="q-text">${q.q}</span></div>
<div class="q-choices">${q.c.map((c,ci)=>`<label class="choice-label" id="cl-${ei}-${qn}-${ci}" onclick="pick(${ei},${qn},${ci})"><input type="radio" name="q${ei}-${qn}"><span class="choice-idx">${ci+1}</span><span class="choice-text">${c}</span></label>`).join('')}</div>
<div class="q-explain" id="ex-${ei}-${qn}"><strong>해설:</strong> ${q.ex}</div>
</div>`;
  });
  c.innerHTML=html;
}
function pick(ei,qn,ci) {
  if(document.getElementById('cl-'+ei+'-'+qn+'-0')?.classList.contains('correct')) return;
  answers[ei+'-'+qn]=ci;
  for(let i=0;i<4;i++) {
    const el=document.getElementById('cl-'+ei+'-'+qn+'-'+i);
    if(el) el.classList.toggle('selected',i===ci);
  }
  updateProgress(ei);
}
function updateProgress(ei) {
  let ans=0;
  for(let q=1;q<=40;q++) if(answers[ei+'-'+q]>=0) ans++;
  const bar=document.getElementById('prog'+ei);
  if(bar) bar.style.width=(ans/40*100)+'%';
}
function gradeExam() {
  const ei=currentExam;
  const s1=DATA['exam'+ei+'_s1'], s2=DATA['exam'+ei+'_s2'];
  const allQs=[...s1,...s2];
  let c1=0,c2=0;
  allQs.forEach((q,i)=>{
    const qn=i+1;
    const ua=answers[ei+'-'+qn];
    for(let ci=0;ci<q.c.length;ci++) {
      const el=document.getElementById('cl-'+ei+'-'+qn+'-'+ci);
      if(!el) return;
      el.classList.remove('selected');
      if(ci===q.a) el.classList.add('correct');
      else if(ci===ua&&ua!==q.a) el.classList.add('wrong');
    }
    const ex=document.getElementById('ex-'+ei+'-'+qn);
    if(ex) ex.classList.add('show');
    if(i<20&&ua===q.a) c1++;
    if(i>=20&&ua===q.a) c2++;
  });
  const sc1=c1*5,sc2=c2*5,avg=(sc1+sc2)/2;
  const pass=avg>=70&&sc1>=40&&sc2>=40;
  const rc=document.getElementById('result'+ei);
  rc.classList.add('show');
  document.getElementById('result'+ei+'-icon').textContent=pass?'🎉':'😢';
  const t=document.getElementById('result'+ei+'-title');
  t.textContent=pass?'합격! 축하합니다':'불합격 — 다시 도전하세요';
  t.className='result-title '+(pass?'result-pass':'result-fail');
  document.getElementById('result'+ei+'-grid').innerHTML=`
<div class="result-item"><div class="result-item-val">${avg.toFixed(0)}점</div><div class="result-item-label">평균 점수</div></div>
<div class="result-item"><div class="result-item-val">${sc1}점</div><div class="result-item-label">과목1 점수</div></div>
<div class="result-item"><div class="result-item-val">${sc2}점</div><div class="result-item-label">과목2 점수</div></div>
<div class="result-item"><div class="result-item-val">${c1+c2}/40</div><div class="result-item-label">정답 수</div></div>
<div class="result-item"><div class="result-item-val">${c1}/20</div><div class="result-item-label">과목1 정답</div></div>
<div class="result-item"><div class="result-item-val">${c2}/20</div><div class="result-item-label">과목2 정답</div></div>`;
  // 오답노트 저장
  saveWrongToNote(ei, s1, s2, answers);
  // 오답노트 저장 알림
  const wrongCount = allQs.filter((q,i)=>{const ua=answers[ei+'-'+(i+1)];return ua>=0&&ua!==q.a;}).length;
  if(wrongCount>0) {
    const noteDiv = document.createElement('div');
    noteDiv.className='odalNote-save show';
    noteDiv.innerHTML='📒 <strong>오답노트 저장 완료!</strong> 틀린 문제 '+wrongCount+'개가 오답노트에 기록되었습니다. <a href="../오답노트.html" target="_blank" style="color:#c9a96e;text-decoration:underline;">오답노트 바로가기 →</a>';
    rc.appendChild(noteDiv);
  }
  rc.scrollIntoView({behavior:'smooth',block:'start'});
  if(timers[ei]) clearInterval(timers[ei]);
}
function resetExam() {
  const ei=currentExam;
  for(let q=1;q<=40;q++) answers[ei+'-'+q]=-1;
  renderExam(ei);
  const rc=document.getElementById('result'+ei);
  if(rc) {rc.classList.remove('show');rc.querySelectorAll('.odalNote-save').forEach(e=>e.remove());}
  const bar=document.getElementById('prog'+ei);
  if(bar) bar.style.width='0%';
  if(timers[ei]) clearInterval(timers[ei]);
  initTimer(ei);
}
function showExam(ei,el) {
  document.querySelectorAll('.exam-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.exam-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('exam'+ei).classList.add('active');
  el.classList.add('active');
  currentExam=ei;
  const td=document.getElementById('timer-display');
  const t=document.getElementById('timer'+ei);
  if(td&&t) td.textContent=t.textContent;
  window.scrollTo({top:0,behavior:'smooth'});
}
function initTimer(ei) {
  if(timers[ei]) clearInterval(timers[ei]);
  let secs=50*60;
  function fmt(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0');}
  const t=document.getElementById('timer'+ei);
  const td=document.getElementById('timer-display');
  if(t) t.textContent=fmt(secs);
  timers[ei]=setInterval(()=>{
    secs--;
    if(secs<=0){clearInterval(timers[ei]);gradeExam();return;}
    const s=fmt(secs);
    if(t) t.textContent=s;
    if(currentExam===ei&&td){td.textContent=s;td.classList.toggle('warn',secs<=300);}
  },1000);
}

// ============ 오답노트 트래킹 ============
window.SUBJECT_KEY = 'variable';
window.SUBJECT_NAME = '변액보험';

function _hashQ(str) {
  let h = 0;
  for (let i = 0; i < Math.min(str.length, 40); i++) {
    h = (h * 31 + str.charCodeAt(i)) & 0xFFFFFF;
  }
  return h.toString(16).padStart(6,'0');
}

function saveWrongToNote(ei, s1, s2, answers) {
  try {
    const KEY = 'mrsg_odalNote';
    let data = JSON.parse(localStorage.getItem(KEY) || '{"answers":{},"catStats":{}}');
    const today = new Date().toISOString().split('T')[0];
    const allQs = [...s1, ...s2];
    allQs.forEach((q, i) => {
      const qn = i + 1;
      const userAns = (answers[ei+'-'+qn] !== undefined) ? answers[ei+'-'+qn] : -1;
      if (userAns < 0 || userAns === q.a) return;
      const qId = window.SUBJECT_KEY + '_' + _hashQ(q.q);
      const cat = q.cat || (qn <= 20 ? '과목1' : '과목2');
      const catKey = window.SUBJECT_NAME + '_' + cat;
      if (data.answers[qId]) {
        data.answers[qId].wrongCount++;
        data.answers[qId].lastWrong = today;
        data.answers[qId].lastUserAns = userAns;
      } else {
        data.answers[qId] = {
          subject: window.SUBJECT_KEY,
          subjectName: window.SUBJECT_NAME,
          examNum: ei, qNum: qn, cat, catKey,
          q: q.q, c: q.c, a: q.a, userAns, ex: q.ex,
          wrongCount: 1,
          firstWrong: today,
          lastWrong: today
        };
      }
      data.catStats[catKey] = (data.catStats[catKey] || 0) + 1;
    });
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch(e) { console.warn('오답노트 저장 실패', e); }
}

renderExam(1);
renderExam(2);
initTimer(1);
initTimer(2);
</script>
