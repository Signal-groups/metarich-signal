<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📒 오답노트 — 메타리치 시그널그룹</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Black+Han+Sans&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
:root {
  --primary: #1A2744;
  --primary-light: #2D4A8A;
  --accent: #C9A96E;
  --accent-warm: #E8A84B;
  --bg-dark: #0a0a0a;
  --bg-light: #FAFAF8;
  --bg-surface: #F5F2ED;
  --text-primary: #111111;
  --text-secondary: #4B5563;
  --text-muted: #9CA3AF;
  --life-color: #2563eb;
  --nonlife-color: #16a34a;
  --variable-color: #9333ea;
  --pension-color: #ea580c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
  background: var(--bg-dark);
  color: #e5e7eb;
  word-break: keep-all;
  overflow-wrap: break-word;
  min-height: 100vh;
}

/* ── 헤더 ── */
.top-nav {
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid rgba(201,169,110,0.15);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.top-nav h1 { font-family: 'Noto Serif KR', serif; font-size: 18px; color: var(--accent); letter-spacing: -0.3px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  color: #9CA3AF; font-size: 13px; text-decoration: none;
  padding: 6px 12px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  transition: all 0.2s;
}
.back-btn:hover { color: var(--accent); border-color: rgba(201,169,110,0.3); }

/* ── 통계 바 ── */
.stats-bar {
  background: linear-gradient(135deg, rgba(26,39,68,0.8) 0%, rgba(10,10,10,0.9) 100%);
  border-bottom: 1px solid rgba(201,169,110,0.1);
  padding: 20px;
}
.stats-inner { max-width: 900px; margin: 0 auto; }
.stats-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }
.stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
@media (max-width: 640px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 14px 12px; text-align: center;
  transition: all 0.2s;
}
.stat-card:hover { border-color: rgba(201,169,110,0.2); }
.stat-num { font-size: 24px; font-weight: 700; color: #f3f4f6; }
.stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.stat-card.life .stat-num { color: #60a5fa; }
.stat-card.nonlife .stat-num { color: #4ade80; }
.stat-card.variable .stat-num { color: #c084fc; }
.stat-card.pension .stat-num { color: #fb923c; }

/* ── 필터 탭 ── */
.filter-section { padding: 16px 20px 0; max-width: 900px; margin: 0 auto; }
.filter-tabs {
  display: flex; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  padding-bottom: 0;
}
.filter-tab {
  padding: 9px 16px; border-radius: 10px 10px 0 0;
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.06); border-bottom: none;
  background: rgba(255,255,255,0.03); color: #9CA3AF;
  transition: all 0.2s;
}
.filter-tab:hover { color: #e5e7eb; background: rgba(255,255,255,0.06); }
.filter-tab.active {
  background: rgba(201,169,110,0.12);
  border-color: rgba(201,169,110,0.25);
  color: var(--accent);
}
.filter-tab[data-subject="life"].active { background: rgba(37,99,235,0.12); border-color: rgba(37,99,235,0.3); color: #60a5fa; }
.filter-tab[data-subject="nonlife"].active { background: rgba(22,163,74,0.12); border-color: rgba(22,163,74,0.3); color: #4ade80; }
.filter-tab[data-subject="variable"].active { background: rgba(147,51,234,0.12); border-color: rgba(147,51,234,0.3); color: #c084fc; }
.filter-tab[data-subject="pension"].active { background: rgba(234,88,12,0.12); border-color: rgba(234,88,12,0.3); color: #fb923c; }

/* ── 툴바 ── */
.toolbar { padding: 14px 20px; max-width: 900px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.sort-select {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: #e5e7eb; padding: 7px 12px; border-radius: 8px; font-size: 12px;
  font-family: 'Pretendard Variable', sans-serif; cursor: pointer;
}
.clear-btn {
  background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2);
  color: #f87171; padding: 7px 14px; border-radius: 8px; font-size: 12px;
  cursor: pointer; transition: all 0.2s; font-family: 'Pretendard Variable', sans-serif;
}
.clear-btn:hover { background: rgba(239,68,68,0.15); }

/* ── 콘텐츠 영역 ── */
.content { max-width: 900px; margin: 0 auto; padding: 16px 20px 60px; }

/* ── 빈 상태 ── */
.empty-state {
  text-align: center; padding: 80px 20px;
  background: rgba(255,255,255,0.02); border-radius: 20px;
  border: 1px dashed rgba(255,255,255,0.08);
}
.empty-state .big-icon { font-size: 64px; margin-bottom: 20px; }
.empty-state h2 { font-size: 20px; color: #e5e7eb; margin-bottom: 10px; }
.empty-state p { font-size: 14px; color: var(--text-muted); line-height: 1.8; }
.go-exam-btn {
  display: inline-flex; align-items: center; gap: 8px;
  margin-top: 24px; padding: 12px 24px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: var(--accent); border-radius: 12px; text-decoration: none;
  font-weight: 600; font-size: 14px; transition: all 0.3s;
  border: 1px solid rgba(201,169,110,0.3);
}
.go-exam-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

/* ── 카테고리 카드 ── */
.cat-section { margin-bottom: 12px; }
.cat-header {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px; padding: 16px 20px;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
}
.cat-header:hover { background: rgba(255,255,255,0.05); border-color: rgba(201,169,110,0.15); }
.cat-header-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.subj-badge {
  flex-shrink: 0; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700;
}
.subj-badge.life { background: rgba(37,99,235,0.2); color: #60a5fa; border: 1px solid rgba(37,99,235,0.3); }
.subj-badge.nonlife { background: rgba(22,163,74,0.2); color: #4ade80; border: 1px solid rgba(22,163,74,0.3); }
.subj-badge.variable { background: rgba(147,51,234,0.2); color: #c084fc; border: 1px solid rgba(147,51,234,0.3); }
.subj-badge.pension { background: rgba(234,88,12,0.2); color: #fb923c; border: 1px solid rgba(234,88,12,0.3); }
.cat-name { font-size: 15px; font-weight: 600; color: #f3f4f6; }
.star-row { display: flex; gap: 2px; align-items: center; }
.star { font-size: 16px; }
.star.filled { color: #f59e0b; }
.star.empty { color: rgba(255,255,255,0.15); }
.cat-meta { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.wrong-count { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px; }
.chevron { font-size: 18px; color: var(--text-muted); transition: transform 0.3s; flex-shrink: 0; }
.cat-section.open .chevron { transform: rotate(180deg); }

/* ── 카드 컨텐츠 (질문 + 요약집) ── */
.cat-body { display: none; padding: 4px 0 0; }
.cat-section.open .cat-body { display: block; }

/* 요약집 */
.summary-note {
  background: linear-gradient(135deg, rgba(26,39,68,0.6) 0%, rgba(45,74,138,0.2) 100%);
  border: 1px solid rgba(201,169,110,0.2);
  border-left: 3px solid var(--accent);
  border-radius: 0 12px 12px 0; padding: 16px 18px; margin-bottom: 8px;
}
.summary-note-title { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.summary-note-body { font-size: 13px; color: #d1d5db; line-height: 1.9; }
.summary-note-body strong { color: var(--accent-warm); }
.summary-note-body ul { padding-left: 16px; margin-top: 8px; }
.summary-note-body ul li { margin-bottom: 5px; }

/* 문제 카드 */
.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-card {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 16px 18px;
  transition: all 0.2s;
}
.q-card:hover { border-color: rgba(255,255,255,0.12); }
.q-card.mastered {
  opacity: 0.45;
  border-color: rgba(74,222,128,0.1);
  background: rgba(74,222,128,0.02);
}
.q-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.q-num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px; background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.2); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--accent); }
.q-text { font-size: 14px; color: #f3f4f6; line-height: 1.7; flex: 1; }
.master-btn {
  flex-shrink: 0; padding: 4px 10px; border-radius: 7px; font-size: 11px; font-weight: 600;
  background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2);
  color: #4ade80; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  font-family: 'Pretendard Variable', sans-serif;
}
.master-btn:hover { background: rgba(74,222,128,0.15); }
.master-btn.done { background: rgba(74,222,128,0.05); color: #6b7280; border-color: rgba(255,255,255,0.06); }
.q-choices { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.choice {
  display: flex; align-items: flex-start; gap: 8px; padding: 7px 10px;
  border-radius: 8px; font-size: 13px; border: 1px solid transparent;
}
.choice-num { flex-shrink: 0; width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: rgba(255,255,255,0.05); color: #9CA3AF; }
.choice-text { line-height: 1.5; color: #9CA3AF; }
.choice.correct { background: rgba(74,222,128,0.06); border-color: rgba(74,222,128,0.2); }
.choice.correct .choice-num { background: rgba(74,222,128,0.2); color: #4ade80; }
.choice.correct .choice-text { color: #d1fae5; }
.choice.wrong-ans { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.2); }
.choice.wrong-ans .choice-num { background: rgba(239,68,68,0.2); color: #f87171; }
.choice.wrong-ans .choice-text { color: #fecaca; text-decoration: line-through; }
.q-explanation {
  background: rgba(26,39,68,0.4); border: 1px solid rgba(201,169,110,0.1);
  border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
  color: #9CA3AF; line-height: 1.7;
}
.q-explanation span { color: var(--accent); font-weight: 600; margin-right: 6px; }
.q-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.q-meta-tag { font-size: 11px; padding: 2px 8px; border-radius: 5px; background: rgba(255,255,255,0.04); color: #6b7280; }
.wrong-count-tag { color: #fca5a5; background: rgba(239,68,68,0.08); }

/* ── 스크롤바 ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

/* ── 토스트 ── */
.toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 999;
  background: rgba(26,39,68,0.95); border: 1px solid rgba(201,169,110,0.3);
  color: var(--accent); padding: 12px 20px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  transform: translateY(20px); opacity: 0; transition: all 0.3s;
  pointer-events: none;
}
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<!-- 네비게이션 -->
<nav class="top-nav">
  <div style="display:flex;align-items:center;gap:10px;">
    <h1>📒 오답노트</h1>
    <span id="user-badge" style="font-size:11px;padding:3px 10px;border-radius:6px;background:rgba(201,169,110,0.1);border:1px solid rgba(201,169,110,0.2);color:#c9a96e;display:none;"></span>
  </div>
  <a href="index.html" class="back-btn">
    <iconify-icon icon="solar:arrow-left-linear" width="14"></iconify-icon>
    시험 허브로
  </a>
</nav>

<!-- 통계 바 -->
<div class="stats-bar">
  <div class="stats-inner">
    <div class="stats-title">학습 현황</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">총 오답</div>
      </div>
      <div class="stat-card life">
        <div class="stat-num" id="stat-life">0</div>
        <div class="stat-label">생명보험</div>
      </div>
      <div class="stat-card nonlife">
        <div class="stat-num" id="stat-nonlife">0</div>
        <div class="stat-label">손해보험</div>
      </div>
      <div class="stat-card variable">
        <div class="stat-num" id="stat-variable">0</div>
        <div class="stat-label">변액보험</div>
      </div>
      <div class="stat-card pension">
        <div class="stat-num" id="stat-pension">0</div>
        <div class="stat-label">퇴직연금</div>
      </div>
    </div>
  </div>
</div>

<!-- 필터 탭 -->
<div class="filter-section">
  <div class="filter-tabs">
    <div class="filter-tab active" data-subject="all" onclick="setFilter('all')">전체</div>
    <div class="filter-tab" data-subject="life" onclick="setFilter('life')">생명보험</div>
    <div class="filter-tab" data-subject="nonlife" onclick="setFilter('nonlife')">손해보험</div>
    <div class="filter-tab" data-subject="variable" onclick="setFilter('variable')">변액보험</div>
    <div class="filter-tab" data-subject="pension" onclick="setFilter('pension')">퇴직연금</div>
  </div>
</div>

<!-- 툴바 -->
<div class="toolbar">
  <select class="sort-select" onchange="setSort(this.value)">
    <option value="stars">별점 높은 순</option>
    <option value="count">오답 많은 순</option>
    <option value="subject">과목별</option>
    <option value="alpha">가나다순</option>
  </select>
  <button class="clear-btn" onclick="clearAll()">🗑️ 전체 초기화</button>
</div>

<!-- 메인 콘텐츠 -->
<div class="content" id="main-content"></div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
// =========================================
// 1. 카테고리별 요약집 데이터
// =========================================
const CAT_NOTES = {
  // ── 손해보험 과목1 (보험업법 및 관련법규) ──
  '손해보험_계약자 보호·권리': {
    title: '계약자 보호·권리',
    body: `<strong>핵심 원칙:</strong> 보험계약자는 보험회사에 비해 정보 비대칭이 크므로 법률로 특별히 보호됩니다.<br><br>
<ul>
<li><strong>청약 철회권</strong>: 보험증권 수령일로부터 15일, 청약일로부터 30일 중 짧은 기간 내 철회 가능</li>
<li><strong>품질보증 해지권</strong>: 보험계약 체결 후 3개월 이내 중요 사항 위반 시 해지 가능</li>
<li><strong>민감정보 보호</strong>: 계약자 동의 없이 제3자 제공 금지</li>
<li><strong>불공정 계약 무효</strong>: 약관법 위반 조항은 효력 없음</li>
</ul>`
  },
  '손해보험_모집종사자 의무': {
    title: '모집종사자 의무',
    body: `<strong>보험 모집종사자는 다음 의무를 지닙니다:</strong><br><br>
<ul>
<li><strong>선량한 관리자 의무</strong>: 계약자 이익 우선 원칙</li>
<li><strong>적합성 원칙</strong>: 계약자 재무 상황·니즈에 적합한 상품 권유</li>
<li><strong>설명 의무</strong>: 보장 내용, 보험료, 해지환급금 등 핵심 사항 설명</li>
<li><strong>기록 보존</strong>: 모집 관련 서류 5년 보존 의무</li>
<li><strong>비밀 유지</strong>: 업무상 취득한 계약자 정보 누설 금지</li>
</ul>`
  },
  '손해보험_보험모집 개념': {
    title: '보험모집 개념',
    body: `<strong>보험모집이란</strong> 보험계약의 체결을 중개하거나 대리하는 행위입니다.<br><br>
<ul>
<li><strong>모집 행위 해당</strong>: 청약 권유, 계약 체결 대리, 보험료 수령 행위</li>
<li><strong>모집 행위 비해당</strong>: 단순 정보 제공, 광고 행위</li>
<li><strong>모집 자격 필요</strong>: 무자격 모집 시 형사처벌 (3년 이하 징역 또는 3천만원 이하 벌금)</li>
<li><strong>법령 근거</strong>: 보험업법 제83조~제101조</li>
</ul>`
  },
  '손해보험_모집인 자격': {
    title: '모집인 자격 요건',
    body: `<strong>보험모집 자격 종류:</strong><br><br>
<ul>
<li><strong>보험설계사</strong>: 등록 후 모집 가능, 1개 보험회사 전속 원칙 (예외: 생손보 겸업)</li>
<li><strong>보험대리점(GA)</strong>: 개인형/법인형, 여러 회사 상품 판매 가능</li>
<li><strong>보험중개사</strong>: 독립적으로 계약자를 위해 모집, 고도의 전문성 요구</li>
<li><strong>임직원</strong>: 보험회사 소속, 별도 등록 불필요</li>
<li><strong>결격 사유</strong>: 금치산자, 5년 이내 금융 범죄 전력자 등</li>

// =========================================
// 2. 상태 변수
// =========================================
const _uid = (function(){ try{ return localStorage.getItem('mrsg_uid')||'guest'; }catch(e){ return 'guest'; } })();
const _uname = (function(){ try{ return localStorage.getItem('mrsg_uname')||''; }catch(e){ return ''; } })();
const KEY = 'mrsg_odalNote_' + _uid;
const MASTERED_KEY = 'mrsg_mastered_' + _uid;
let currentFilter = 'all';
let currentSort = 'stars';
let noteData = { answers: {}, catStats: {} };
let masteredIds = JSON.parse(localStorage.getItem(MASTERED_KEY) || '{}');

// =========================================
// 3. 데이터 로드
// =========================================
function loadData() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) noteData = JSON.parse(raw);
  } catch(e) {
    noteData = { answers: {}, catStats: {} };
  }
}

// =========================================
// 4. 통계 계산
// =========================================
function calcStats() {
  const all = Object.values(noteData.answers);
  const counts = { total: 0, life: 0, nonlife: 0, variable: 0, pension: 0 };
  all.forEach(q => {
    if (masteredIds[q.q?.slice(0,20)]) return;
    counts.total++;
    if (q.subject === 'life') counts.life++;
    else if (q.subject === 'nonlife') counts.nonlife++;
    else if (q.subject === 'variable') counts.variable++;
    else if (q.subject === 'pension') counts.pension++;
  });
  return counts;
}

// =========================================
// 5. 카테고리 그룹화
// =========================================
function groupByCategory() {
  const groups = {};
  Object.values(noteData.answers).forEach(q => {
    const catKey = q.catKey || (q.subjectName + '_' + (q.cat || '과목1'));
    if (!groups[catKey]) {
      groups[catKey] = {
        catKey,
        subject: q.subject,
        subjectName: q.subjectName,
        cat: q.cat || '과목1',
        questions: [],
        stars: Math.min(noteData.catStats[catKey] || 0, 5),
        totalWrong: noteData.catStats[catKey] || 0,
      };
    }
    groups[catKey].questions.push(q);
  });
  return groups;
}

// =========================================
// 6. 렌더링
// =========================================
function renderStars(n) {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    s += `<span class="star ${i <= n ? 'filled' : 'empty'}">${i <= n ? '★' : '☆'}</span>`;
  }
  return s;
}

function subjectClass(subj) {
  const m = { life:'life', nonlife:'nonlife', variable:'variable', pension:'pension' };
  return m[subj] || 'life';
}
function subjectLabel(subj) {
  const m = { life:'생명보험', nonlife:'손해보험', variable:'변액보험', pension:'퇴직연금' };
  return m[subj] || subj;
}

function renderQuestion(q, idx) {
  const mKey = q.q?.slice(0,20) || idx;
  const isMastered = !!masteredIds[mKey];
  const choicesHtml = (q.c || []).map((c, i) => {
    let cls = '';
    if (i === q.a) cls = 'correct';
    else if (i === q.userAns || i === q.lastUserAns) cls = 'wrong-ans';
    return `<div class="choice ${cls}">
      <span class="choice-num">${i+1}</span>
      <span class="choice-text">${c}</span>
    </div>`;
  }).join('');

  return `<div class="q-card ${isMastered ? 'mastered' : ''}" id="qcard-${idx}">
    <div class="q-header">
      <div class="q-num">${idx+1}</div>
      <div class="q-text">${q.q || '질문 없음'}</div>
      <button class="master-btn ${isMastered ? 'done' : ''}" onclick="toggleMaster('${mKey}', ${idx})">
        ${isMastered ? '✓ 완료' : '✓ 완료 처리'}
      </button>
    </div>
    <div class="q-choices">${choicesHtml}</div>
    ${q.ex ? `<div class="q-explanation"><span>해설</span>${q.ex}</div>` : ''}
    <div class="q-meta">
      <span class="q-meta-tag wrong-count-tag">오답 ${q.wrongCount || 1}회</span>
      <span class="q-meta-tag">최근 ${q.lastWrong || ''}</span>
    </div>
  </div>`;
}

function renderCategoryCard(group, openOnLoad) {
  const note = CAT_NOTES[group.catKey] || CAT_NOTES[group.subjectName + '_과목1'] || null;
  const activeQs = group.questions.filter(q => !masteredIds[q.q?.slice(0,20)]);
  if (activeQs.length === 0) return '';

  const noteHtml = note ? `<div class="summary-note">
    <div class="summary-note-title">📖 핵심 요약 — ${note.title}</div>
    <div class="summary-note-body">${note.body}</div>
  </div>` : '';

  const questionsHtml = activeQs.map((q, i) => renderQuestion(q, i)).join('');
  const cls = subjectClass(group.subject);

  return `<div class="cat-section" id="cat-${group.catKey.replace(/[^a-zA-Z0-9가-힣]/g,'_')}">
    <div class="cat-header" onclick="toggleCat(this)">
      <div class="cat-header-left">
        <span class="subj-badge ${cls}">${subjectLabel(group.subject)}</span>
        <span class="cat-name">${group.cat}</span>
        <div class="star-row">${renderStars(group.stars)}</div>
      </div>
      <div class="cat-meta">
        <span class="wrong-count">오답 ${group.totalWrong}회</span>
        <span class="chevron">⌄</span>
      </div>
    </div>
    <div class="cat-body">
      ${noteHtml}
      <div class="q-list">${questionsHtml}</div>
    </div>
  </div>`;
}

function render() {
  loadData();
  const stats = calcStats();
  document.getElementById('stat-total').textContent = stats.total;
  document.getElementById('stat-life').textContent = stats.life;
  document.getElementById('stat-nonlife').textContent = stats.nonlife;
  document.getElementById('stat-variable').textContent = stats.variable;
  document.getElementById('stat-pension').textContent = stats.pension;

  const groups = groupByCategory();
  let entries = Object.values(groups);

  // 필터
  if (currentFilter !== 'all') {
    entries = entries.filter(g => g.subject === currentFilter);
  }

  // 정렬
  if (currentSort === 'stars') entries.sort((a,b) => b.stars - a.stars || b.totalWrong - a.totalWrong);
  else if (currentSort === 'count') entries.sort((a,b) => b.totalWrong - a.totalWrong);
  else if (currentSort === 'subject') entries.sort((a,b) => a.subject.localeCompare(b.subject));
  else if (currentSort === 'alpha') entries.sort((a,b) => a.cat.localeCompare(b.cat));

  const container = document.getElementById('main-content');

  if (entries.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="big-icon">📝</div>
      <h2>${stats.total === 0 ? '아직 오답 기록이 없어요' : '해당 과목의 오답이 없어요'}</h2>
      <p>${stats.total === 0
        ? '시험을 응시하면 틀린 문제가 자동으로 여기에 저장됩니다.<br>각 과목 모의고사를 풀고 오답노트를 완성해보세요!'
        : '다른 과목 필터를 선택하거나 해당 과목 시험을 응시해보세요.'
      }</p>
      <a href="index.html" class="go-exam-btn">
        <iconify-icon icon="solar:book-bold" width="16"></iconify-icon>
        시험 허브 바로가기
      </a>
    </div>`;
    return;
  }

  container.innerHTML = entries.map(g => renderCategoryCard(g, false)).join('');
}

// =========================================
// 7. 인터랙션
// =========================================
function toggleCat(header) {
  const section = header.parentElement;
  section.classList.toggle('open');
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.subject === f));
  render();
}

function setSort(v) {
  currentSort = v;
  render();
}

function toggleMaster(mKey, idx) {
  if (masteredIds[mKey]) delete masteredIds[mKey];
  else masteredIds[mKey] = true;
  localStorage.setItem(MASTERED_KEY, JSON.stringify(masteredIds));
  showToast(masteredIds[mKey] ? '✓ 완료 처리되었습니다' : '↩️ 완료 취소되었습니다');
  render();
}

function clearAll() {
  if (!confirm('모든 오답 기록을 초기화할까요?\n이 작업은 되돌릴 수 없습니다.')) return;
  localStorage.removeItem(KEY);
  localStorage.removeItem(MASTERED_KEY);
  masteredIds = {};
  noteData = { answers: {}, catStats: {} };
  showToast('🗑️ 초기화 완료');
  render();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 8. 초기 실행
// =========================================

  const badge = document.getElementById('user-badge');
  if (badge && _uname && _uid !== 'guest') {
    badge.textContent = '👤 ' + _uname;
    badge.style.display = 'inline-block';
  }
})();

render();
</script>
