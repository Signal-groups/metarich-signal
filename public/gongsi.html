<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보험사 공시·연락처 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1e3c;
    --navy2:#182b4c;
    --blue:#2563eb;
    --gold:#d5a11e;
    --green:#0f8b5f;
    --red:#e54822;
    --line:#dbe4ef;
    --soft:#f3f6fb;
    --text:#10213f;
    --muted:#66748a;
    --shadow:0 18px 45px rgba(15,30,60,.1);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--soft);
    color:var(--text);
    font-family:"Noto Sans KR",sans-serif;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    height:64px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    box-shadow:0 8px 24px rgba(15,30,60,.22);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    font-weight:900;
    letter-spacing:-.2px;
  }
  .brand-mark{
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
  }
  .close-btn{
    min-height:40px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:0 15px;
    color:#fff;
    background:rgba(255,255,255,.1);
    font-weight:900;
    cursor:pointer;
  }
  .wrap{
    width:min(1220px,calc(100% - 40px));
    margin:28px auto 54px;
  }
  .hero{
    display:grid;
    gap:18px;
    grid-template-columns:minmax(0,1fr) 340px;
    align-items:stretch;
    margin-bottom:18px;
  }
  .intro,.tools{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
  }
  .intro{
    padding:28px;
  }
  .eyebrow{
    margin:0 0 8px;
    color:var(--blue);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.3px;
  }
  h1{
    margin:0;
    font-size:32px;
    line-height:1.2;
    letter-spacing:-.8px;
  }
  .intro p{
    margin:10px 0 0;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    line-height:1.65;
  }
  .tools{
    padding:18px;
    display:grid;
    gap:12px;
  }
  .search{
    position:relative;
  }
  .search input{
    width:100%;
    height:50px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#f8fafc;
    padding:0 42px 0 44px;
    color:var(--text);
    font-size:14px;
    font-weight:800;
    outline:none;
  }
  .search span{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .filter{
    border:1px solid var(--line);
    border-radius:999px;
    background:#fff;
    padding:9px 13px;
    color:#526175;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .filter.active{
    border-color:#162848;
    background:#162848;
    color:#fff;
  }
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0;
  }
  .summary-card{
    min-height:82px;
    padding:15px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#fff;
    box-shadow:0 10px 24px rgba(15,30,60,.05);
  }
  .summary-card b{
    display:block;
    font-size:22px;
    color:#10213f;
  }
  .summary-card span{
    display:block;
    margin-top:4px;
    color:#66748a;
    font-size:12px;
    font-weight:900;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }
  .card{
    overflow:hidden;
    border:1px solid var(--line);
    border-radius:20px;
    background:#fff;
    box-shadow:0 12px 30px rgba(15,30,60,.07);
  }
  .card-head{
    min-height:76px;
    padding:16px;
    color:#fff;
    background:var(--navy);
    display:flex;
    align-items:center;
    gap:12px;
  }
  .initial{
    width:42px;
    height:42px;
    border-radius:14px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.2);
    font-size:13px;
    font-weight:900;
    flex:0 0 auto;
  }
  .company-name{
    margin:0;
    font-size:17px;
    font-weight:900;
    line-height:1.2;
  }
  .company-type{
    margin-top:4px;
    font-size:12px;
    font-weight:800;
    opacity:.85;
  }
  .card-body{
    padding:16px;
  }
  .info-row{
    display:flex;
    justify-content:space-between;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
    font-weight:800;
  }
  .info-row:last-child{border-bottom:0}
  .info-row span{color:#66748a}
  .info-row strong{
    color:#10213f;
    text-align:right;
  }
  .actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:0 16px 16px;
  }
  .action{
    min-height:42px;
    border:1px solid var(--line);
    border-radius:13px;
    background:#f8fafc;
    color:#10213f;
    font-size:12px;
    font-weight:900;
    text-decoration:none;
    display:grid;
    place-items:center;
    cursor:pointer;
  }
  .action.primary{
    background:#152744;
    border-color:#152744;
    color:#fff;
  }
  .action:hover{filter:brightness(.97)}
  .empty{
    display:none;
    padding:60px 20px;
    border:1px dashed #bac6d8;
    border-radius:22px;
    background:#fff;
    color:#66748a;
    text-align:center;
    font-weight:900;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    border-radius:999px;
    background:#10213f;
    color:#fff;
    padding:12px 18px;
    font-size:13px;
    font-weight:900;
    transition:.18s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  @media (max-width:980px){
    .hero{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .summary{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .topbar{padding:0 14px}
    .wrap{width:calc(100% - 24px);margin-top:16px}
    .intro{padding:22px}
    h1{font-size:26px}
    .grid{grid-template-columns:1fr}
    .summary{grid-template-columns:1fr}
    .actions{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">📊</div>

    <button class="close-btn" onclick="closePage()">창 닫기</button>

  <main class="wrap">

        <h1>상품공시, 대표번호, 모니터링 번호를 한 화면에서 확인합니다.</h1>
        <p>
          상담과 사무실 업무에 필요한 공시실, 청구서류 안내, 보험사 연락처를 빠르게 찾을 수 있도록 정리했습니다.
          검색과 분류를 함께 사용하면 고객 상담 중 필요한 보험사를 바로 좁혀볼 수 있습니다.
        </p>
      </div>
      <aside class="tools">

        </div>
        <div class="filters" id="filters">

          <button class="filter" data-type="damage">손해보험</button>
          <button class="filter" data-type="life">생명보험</button>
          <button class="filter" data-type="gongjae">공제·보증</button>
          <button class="filter" data-type="digital">디지털</button>
        </div>
      </aside>
    </section>

    <section class="summary">
      <div class="summary-card"><b id="totalCount">0</b><span>검색 결과</span></div>
      <div class="summary-card"><b id="damageCount">0</b><span>손해보험</span></div>
      <div class="summary-card"><b id="lifeCount">0</b><span>생명보험</span></div>

    <section class="grid" id="companyGrid"></section>
    <section class="empty" id="emptyState">검색 조건에 맞는 보험사가 없습니다.</section>
  </main>

  <div class="toast" id="toast">연락처가 복사되었습니다.</div>

const TYPE_LABELS = {
  damage:"손해보험",
  life:"생명보험",
  gongjae:"공제·보증",
  digital:"디지털보험"
}

let activeType = "all"
const grid = document.getElementById("companyGrid")
const emptyState = document.getElementById("emptyState")
const searchInput = document.getElementById("searchInput")
const filters = document.querySelectorAll(".filter")
const toast = document.getElementById("toast")

function closePage(){
  if(window.opener){ window.close(); return }
  history.back()
}

function normalize(value){
  return String(value || "").replace(/\s/g,"").toLowerCase()
}

function copyContact(company){
  const text = `${company.name}\n보험회사 ${company.phone}\n모니터링 ${company.monitoring}`
  navigator.clipboard.writeText(text).then(() => {
    toast.classList.add("show")
    setTimeout(() => toast.classList.remove("show"), 1500)
  })
}

function render(){
  const keyword = normalize(searchInput.value)
  const items = COMPANIES.filter(company => {
    const typeOk = activeType === "all" || company.type === activeType
    const keywordOk = !keyword || normalize(`${company.name} ${company.phone} ${company.monitoring}`).includes(keyword)
    return typeOk && keywordOk
  })

  grid.innerHTML = items.map(company => `
    <article class="card">
      <div class="card-head" style="background:${company.color}">
        <div class="initial">${company.name.slice(0,2)}</div>
        <div>
          <h2 class="company-name">${company.name}</h2>
          <div class="company-type">${TYPE_LABELS[company.type]}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row"><span>대표번호</span><strong>${company.phone}</strong></div>
        <div class="info-row"><span>모니터링</span><strong>${company.monitoring}</strong></div>
      </div>
      <div class="actions">
        <a class="action primary" href="${company.disclose}" target="_blank" rel="noopener">상품공시</a>
        <a class="action" href="/claim-documents" target="_blank" rel="noopener">청구서류</a>
        <button class="action" type="button" onclick='copyContact(${JSON.stringify(company)})'>연락처 복사</button>
      </div>
    </article>
  `).join("")

  emptyState.style.display = items.length ? "none" : "block"
  document.getElementById("totalCount").textContent = items.length
  document.getElementById("damageCount").textContent = items.filter(item => item.type === "damage").length
  document.getElementById("lifeCount").textContent = items.filter(item => item.type === "life").length
  document.getElementById("etcCount").textContent = items.filter(item => item.type === "gongjae" || item.type === "digital").length
}

filters.forEach(button => {
  button.addEventListener("click", () => {
    filters.forEach(item => item.classList.remove("active"))
    button.classList.add("active")
    activeType = button.dataset.type
    render()
  })
})

searchInput.addEventListener("input", render)
render()
</script>
</body>
</html>
