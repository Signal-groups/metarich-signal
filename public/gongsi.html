<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보험사 공시·연락처 포털</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1e3c;
    --navy2:#182b4c;
    --blue:#2563eb;
    --gold:#d5a11e;
    --green:#0f8b5f;
    --red:#e54822;
    --line:#dbe4ef;
    --soft:#f3f6fb;
    --text:#10213f;
    --muted:#66748a;
    --shadow:0 18px 45px rgba(15,30,60,.1);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--soft);
    color:var(--text);
    font-family:"Noto Sans KR",sans-serif;
  }
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    height:64px;
    padding:0 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(135deg,var(--navy),var(--navy2));
    box-shadow:0 8px 24px rgba(15,30,60,.22);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    font-weight:900;
    letter-spacing:-.2px;
  }
  .brand-mark{
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.18);
  }
  .close-btn{
    min-height:40px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:12px;
    padding:0 15px;
    color:#fff;
    background:rgba(255,255,255,.1);
    font-weight:900;
    cursor:pointer;
  }
  .top-actions{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .nav-btn{
    min-height:40px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:12px;
    padding:0 15px;
    color:#fff;
    background:rgba(255,255,255,.14);
    font-weight:900;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
  }
  .wrap{
    width:min(1220px,calc(100% - 40px));
    margin:28px auto 54px;
  }
  .hero{
    display:grid;
    gap:18px;
    grid-template-columns:minmax(0,1fr) 340px;
    align-items:stretch;
    margin-bottom:18px;
  }
  .intro,.tools{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    box-shadow:var(--shadow);
  }
  .intro{
    padding:28px;
  }
  .eyebrow{
    margin:0 0 8px;
    color:var(--blue);
    font-size:12px;
    font-weight:900;
    letter-spacing:1.3px;
  }
  h1{
    margin:0;
    font-size:32px;
    line-height:1.2;
    letter-spacing:-.8px;
  }
  .intro p{
    margin:10px 0 0;
    color:var(--muted);
    font-size:14px;
    font-weight:700;
    line-height:1.65;
  }
  .tools{
    padding:18px;
    display:grid;
    gap:12px;
  }
  .search{
    position:relative;
  }
  .search input{
    width:100%;
    height:50px;
    border:1px solid var(--line);
    border-radius:16px;
    background:#f8fafc;
    padding:0 42px 0 44px;
    color:var(--text);
    font-size:14px;
    font-weight:800;
    outline:none;
  }
  .search span{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .filter{
    border:1.5px solid var(--line);
    border-radius:999px;
    background:#fff;
    padding:9px 13px;
    color:#526175;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .filter.active{
    border-color:#5aa17f;
    background:#f3fbf7;
    color:#176947;
  }
  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin:18px 0;
  }
  .summary-card{
    min-height:82px;
    padding:15px;
    border:1px solid var(--line);
    border-radius:18px;
    background:#fff;
    box-shadow:0 10px 24px rgba(15,30,60,.05);
  }
  .summary-card b{
    display:block;
    font-size:22px;
    color:#10213f;
  }
  .summary-card span{
    display:block;
    margin-top:4px;
    color:#66748a;
    font-size:12px;
    font-weight:900;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
  }
  .view-toggle{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin:-4px 0 14px;
  }
  .view-btn{
    min-height:38px;
    border:1.5px solid var(--line);
    border-radius:12px;
    background:#fff;
    padding:0 13px;
    color:#66748a;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
  }
  .view-btn.active{
    border-color:#5aa17f;
    color:#176947;
    background:#f3fbf7;
  }
  .grid.list-mode{
    grid-template-columns:1fr;
  }
  .grid.list-mode .card{
    display:grid;
    grid-template-columns:300px minmax(0,1fr);
    align-items:center;
  }
  .grid.list-mode .card-head{
    border-bottom:0;
  }
  .grid.list-mode .card-body{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 18px;
  }
  .card{
    overflow:hidden;
    border:1px solid var(--line);
    border-top:4px solid var(--card-color,#dbe4ef);
    border-radius:20px;
    background:#fff;
    box-shadow:0 12px 30px rgba(15,30,60,.07);
  }
  .card-head{
    min-height:88px;
    padding:16px;
    color:var(--text);
    background:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #edf2f7;
  }
  .logo-box{
    width:68px;
    height:42px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:#fff;
    border:1px solid #edf2f7;
    padding:7px;
    flex:0 0 auto;
  }
  .logo-box img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    display:block;
  }
  .logo-fallback{
    font-size:12px;
    font-weight:900;
    color:#475569;
  }
  .company-name{
    margin:0;
    font-size:17px;
    font-weight:900;
    line-height:1.2;
  }
  .company-title{
    min-width:0;
  }
  .company-title-row{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .disclosure-link{
    min-height:30px;
    padding:0 10px;
    border:1.5px solid var(--card-color,#152744);
    border-radius:999px;
    background:#fff;
    color:#10213f;
    font-size:11px;
    font-weight:900;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
  }
  .disclosure-link:hover{filter:brightness(.97)}
  .cardpay-button{
    border:0;
    border-radius:999px;
    background:#e8fff5;
    color:#069669;
    padding:5px 10px;
    font-size:11px;
    font-weight:900;
    cursor:pointer;
    white-space:nowrap;
  }
  .cardpay-button.no-info{
    background:#f1f5f9;
    color:#94a3b8;
  }
  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:80;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(15,30,60,.42);
    backdrop-filter:blur(8px);
  }
  .modal-backdrop.show{display:flex}
  .cardpay-modal{
    width:min(450px,100%);
    max-height:min(760px,calc(100vh - 40px));
    overflow:hidden;
    border-radius:16px;
    border:1px solid #dbe4ef;
    background:#fff;
    box-shadow:0 24px 70px rgba(15,30,60,.24);
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:16px 20px;
    border-bottom:1px solid #edf2f7;
  }
  .modal-title{
    margin:0;
    color:#10213f;
    font-size:17px;
    font-weight:900;
  }
  .modal-icon{
    color:#0f8b5f;
    font-size:17px;
  }
  .modal-close{
    width:32px;
    height:32px;
    border:0;
    border-radius:50%;
    background:#f8fafc;
    color:#94a3b8;
    font-size:22px;
    line-height:1;
    cursor:pointer;
  }
  .modal-body{
    max-height:calc(100vh - 150px);
    overflow:auto;
    padding:18px 20px 20px;
  }
  .modal-note{
    margin:0 0 16px;
    color:#8a97aa;
    font-size:13px;
    font-weight:700;
    line-height:1.55;
  }
  .cardpay-table{
    display:grid;
    gap:13px;
  }
  .cardpay-row{
    display:grid;
    grid-template-columns:112px minmax(0,1fr);
    gap:12px;
    font-size:14px;
    line-height:1.65;
  }
  .cardpay-row dt{
    color:#26344f;
    font-weight:900;
  }
  .cardpay-row dd{
    margin:0;
    color:#111827;
    font-weight:700;
  }
  .cardpay-empty{
    border-radius:14px;
    background:#f8fafc;
    padding:22px;
    color:#64748b;
    text-align:center;
    font-size:15px;
    font-weight:900;
  }
  .company-type{
    margin-top:4px;
    font-size:12px;
    font-weight:800;
    color:#66748a;
  }
  .favorite-btn{
    margin-left:auto;
    width:34px;
    height:34px;
    border:1px solid #dbe4ef;
    border-radius:50%;
    background:#fff;
    color:#9aa8ba;
    font-size:20px;
    line-height:1;
    cursor:pointer;
  }
  .favorite-btn.active{
    border-color:#d5a11e;
    color:#d5a11e;
    background:#fffbeb;
  }
  .card-body{
    padding:16px;
  }
  .info-row{
    display:flex;
    justify-content:space-between;
    gap:14px;
    padding:10px 0;
    border-bottom:1px solid #edf2f7;
    font-size:13px;
    font-weight:800;
  }
  .info-row:last-child{border-bottom:0}
  .info-row span{color:#66748a}
  .info-row strong{
    color:#10213f;
    text-align:right;
  }
  .empty{
    display:none;
    padding:60px 20px;
    border:1px dashed #bac6d8;
    border-radius:22px;
    background:#fff;
    color:#66748a;
    text-align:center;
    font-weight:900;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%) translateY(20px);
    opacity:0;
    pointer-events:none;
    border-radius:999px;
    background:#10213f;
    color:#fff;
    padding:12px 18px;
    font-size:13px;
    font-weight:900;
    transition:.18s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  @media (max-width:980px){
    .hero{grid-template-columns:1fr}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.list-mode .card{grid-template-columns:1fr}
    .summary{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:640px){
    .topbar{padding:0 14px}
    .top-actions{gap:6px}
    .nav-btn,.close-btn{padding:0 10px;font-size:12px}
    .wrap{width:calc(100% - 24px);margin-top:16px}
    .intro{padding:22px}
    h1{font-size:26px}
    .grid{grid-template-columns:1fr}
    .summary{grid-template-columns:1fr}
    .company-title-row{align-items:flex-start}
  }
</style>
</head>

  <header class="topbar">

  <main class="wrap">
    <section class="hero">
      <div class="intro">
        <p class="eyebrow">INSURANCE DISCLOSURE PORTAL</p>

          검색과 분류를 함께 사용하면 고객 상담 중 필요한 보험사를 바로 좁혀볼 수 있습니다.
        </p>
      </div>
      <aside class="tools">
        <div class="search">
          <span>🔎</span>

        </div>
        <div class="filters" id="filters">
          <button class="filter active" data-type="all">전체</button>
          <button class="filter" data-type="favorite">즐겨찾기</button>
          <button class="filter" data-type="damage">손해보험</button>
          <button class="filter" data-type="life">생명보험</button>
          <button class="filter" data-type="gongjae">공제·보증</button>
          <button class="filter" data-type="digital">디지털</button>
        </div>
      </aside>
    </section>

    <section class="summary">
      <div class="summary-card"><b id="totalCount">0</b><span>검색 결과</span></div>
      <div class="summary-card"><b id="damageCount">0</b><span>손해보험</span></div>
      <div class="summary-card"><b id="lifeCount">0</b><span>생명보험</span></div>
      <div class="summary-card"><b id="etcCount">0</b><span>공제·디지털</span></div>
    </section>

    <section class="view-toggle" aria-label="보기 방식">
      <button class="view-btn active" type="button" data-view="grid">카드 보기</button>
      <button class="view-btn" type="button" data-view="list">리스트 보기</button>
    </section>

    <section class="grid" id="companyGrid"></section>
    <section class="empty" id="emptyState">검색 조건에 맞는 보험사가 없습니다.</section>
  </main>

  <div class="toast" id="toast">연락처가 복사되었습니다.</div>
  <div class="modal-backdrop" id="cardPayModal" aria-hidden="true">
    <section class="cardpay-modal" role="dialog" aria-modal="true" aria-labelledby="cardPayTitle">
      <div class="modal-head">
        <h2 class="modal-title" id="cardPayTitle"><span class="modal-icon">▱</span> 카드납 정보</h2>
        <button class="modal-close" type="button" onclick="closeCardPayModal()" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="cardPayBody"></div>
    </section>
  </div>

const TYPE_LABELS = {
  damage:"손해보험",
  life:"생명보험",
  gongjae:"공제·보증",
  digital:"디지털보험"
}

let activeType = "all"
let currentUserId = null
let favoriteKeys = new Set()
let viewMode = "grid"
const grid = document.getElementById("companyGrid")
const emptyState = document.getElementById("emptyState")
const searchInput = document.getElementById("searchInput")
const filters = document.querySelectorAll(".filter")
const viewButtons = document.querySelectorAll(".view-btn")
const toast = document.getElementById("toast")
const cardPayModal = document.getElementById("cardPayModal")
const cardPayBody = document.getElementById("cardPayBody")
const cardPayTitle = document.getElementById("cardPayTitle")

function closePage(){
  if(window.opener){ window.close(); return }
  history.back()
}

function normalize(value){
  return String(value || "").replace(/\s/g,"").toLowerCase()
}

function escapeHTML(value){
  return String(value || "").replace(/[&<>"']/g, (char) => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]))
}

function copyContact(company){
  const text = `${company.name}\n보험회사 ${company.phone}\n모니터링 ${company.monitoring}`
  navigator.clipboard.writeText(text).then(() => {
    toast.classList.add("show")
    setTimeout(() => toast.classList.remove("show"), 1500)
  })
}

function openCardPayModal(companyName){
  const info = CARD_PAYMENT_INFO[companyName]
  cardPayTitle.innerHTML = `<span class="modal-icon">▱</span> ${escapeHTML(companyName)} 카드납 정보`
  if (!info) {
    cardPayBody.innerHTML = `
      <p class="modal-note">참고용으로만 사용하시고, 정확한 정보는 보험사 담당자에게 문의 부탁드립니다.</p>
      <div class="cardpay-empty">해당사항 없음</div>
    `
  } else {
    const rows = ["구분", "수납", "신청 방법", "1회성수납", "카드 범위", "제휴사", "기타"]
      .map((label) => `
        <div class="cardpay-row">
          <dt>${label}</dt>
          <dd>${escapeHTML(info[label] || "해당사항 없음")}</dd>
        </div>
      `).join("")
    cardPayBody.innerHTML = `
      <p class="modal-note">참고용으로만 사용하시고, 정확한 정보는 보험사 담당자에게 문의 부탁드립니다.</p>
      <dl class="cardpay-table">${rows}</dl>
    `
  }
  cardPayModal.classList.add("show")
  cardPayModal.setAttribute("aria-hidden", "false")
}

function closeCardPayModal(){
  cardPayModal.classList.remove("show")
  cardPayModal.setAttribute("aria-hidden", "true")
}

window.openCardPayModal = openCardPayModal
window.closeCardPayModal = closeCardPayModal

cardPayModal.addEventListener("click", (event) => {
  if (event.target === cardPayModal) closeCardPayModal()
})

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && cardPayModal.classList.contains("show")) closeCardPayModal()
})

async function initFavorites(){
  if (!supabaseClient) return
  const { data: { session } } = await supabaseClient.auth.getSession()
  currentUserId = session?.user?.id || null
  if (!currentUserId) {
    render()
    return
  }
  const { data, error } = await supabaseClient
    .from("insurer_favorites")
    .select("insurer_key")
    .eq("user_id", currentUserId)
  if (!error && data) favoriteKeys = new Set(data.map(item => item.insurer_key))
  render()
}

async function toggleFavorite(insurerKey, insurerName){
  if (!currentUserId) {
    alert("로그인 후 즐겨찾기를 사용할 수 있습니다.")
    return
  }

  if (favoriteKeys.has(insurerKey)) {
    const { error } = await supabaseClient
      .from("insurer_favorites")
      .delete()
      .eq("user_id", currentUserId)
      .eq("insurer_key", insurerKey)
    if (!error) favoriteKeys.delete(insurerKey)
  } else {
    const { error } = await supabaseClient
      .from("insurer_favorites")
      .insert({ user_id: currentUserId, insurer_key: insurerKey, insurer_name: insurerName })
    if (!error) favoriteKeys.add(insurerKey)
  }
  render()
}

function render(){
  const keyword = normalize(searchInput.value)
  const items = COMPANIES.filter(company => {
    const favoriteOk = activeType !== "favorite" || favoriteKeys.has(company.name)
    const typeOk = activeType === "all" || activeType === "favorite" || company.type === activeType
    const keywordOk = !keyword || normalize(`${company.name} ${company.phone} ${company.monitoring}`).includes(keyword)
    return favoriteOk && typeOk && keywordOk
  }).sort((a,b) => {
    const favoriteDiff = Number(favoriteKeys.has(b.name)) - Number(favoriteKeys.has(a.name))
    if (activeType === "all" && favoriteDiff) return favoriteDiff
    return a.name.localeCompare(b.name, "ko-KR", { numeric:true, sensitivity:"base" })
  })

  grid.classList.toggle("list-mode", viewMode === "list")

  grid.innerHTML = items.map(company => `
    <article class="card" style="--card-color:${company.color}">
      <div class="card-head">
        <div class="logo-box">
          ${company.logo ? `<img src="${company.logo}" alt="${company.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback',textContent:'${company.name.slice(0,2)}'}))">` : `<span class="logo-fallback">${company.name.slice(0,2)}</span>`}
        </div>
        <div class="company-title">
          <div class="company-title-row">
            <h2 class="company-name">${company.name}</h2>
            <a class="disclosure-link" href="${company.disclose}" target="_blank" rel="noopener">약관확인</a>
          </div>
          <div class="company-type">${TYPE_LABELS[company.type]}</div>
        </div>
        <button class="favorite-btn ${favoriteKeys.has(company.name) ? "active" : ""}" type="button" title="즐겨찾기" onclick='toggleFavorite(${JSON.stringify(company.name)}, ${JSON.stringify(company.name)})'>${favoriteKeys.has(company.name) ? "★" : "☆"}</button>
      </div>
      <div class="card-body">
        <div class="info-row"><span>대표번호</span><strong>${company.phone}</strong></div>
        <div class="info-row"><span>모니터링</span><strong>${company.monitoring}</strong></div>
        <div class="info-row"><span>카드납</span><strong><button class="cardpay-button ${CARD_PAYMENT_INFO[company.name] ? "" : "no-info"}" type="button" onclick='openCardPayModal(${JSON.stringify(company.name)})'>${CARD_PAYMENT_INFO[company.name] ? "정보 보기" : "해당사항 없음"}</button></strong></div>
        <div class="info-row"><span>전산헬프데스크</span><strong>${company.helpdesk || "확인 필요"}</strong></div>
        <div class="info-row"><span>청구팩스</span><strong>${company.claimFax || "확인 필요"}</strong></div>
      </div>
    </article>
  `).join("")

  emptyState.style.display = items.length ? "none" : "block"
  document.getElementById("totalCount").textContent = items.length
  document.getElementById("damageCount").textContent = items.filter(item => item.type === "damage").length
  document.getElementById("lifeCount").textContent = items.filter(item => item.type === "life").length
  document.getElementById("etcCount").textContent = items.filter(item => item.type === "gongjae" || item.type === "digital").length
}

filters.forEach(button => {
  button.addEventListener("click", () => {
    filters.forEach(item => item.classList.remove("active"))
    button.classList.add("active")
    activeType = button.dataset.type
    render()
  })
})

viewButtons.forEach(button => {
  button.addEventListener("click", () => {
    viewButtons.forEach(item => item.classList.remove("active"))
    button.classList.add("active")
    viewMode = button.dataset.view
    render()
  })
})

searchInput.addEventListener("input", render)
initFavorites()
</script>
